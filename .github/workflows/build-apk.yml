name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch: 

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout the main repository into a 'Lumera' directory (Com LFS)
      - name: Checkout Lumera
        uses: actions/checkout@v4
        with:
          path: Lumera
          submodules: recursive
          lfs: true

      # 2. Checkout the auxiliary project into a sibling 'assrender' directory
      - name: Checkout assrender
        uses: actions/checkout@v4
        with:
          repository: LumeraD3v/assrender
          path: assrender
          submodules: recursive

      # 3. Verify directory structure for assrender
      - name: Verify assrender directory
        run: |
          echo "Current directory structure:"
          ls -R .
          if [ ! -d "assrender/assrender" ]; then
            echo "::error::assrender/assrender directory not found! Check repository structure."
            exit 1
          fi

      # 4. Set up JDK 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # 4.1 Create populated local.properties to prevent initialization crashes
      - name: Create local.properties
        run: |
          cat <<EOF > Lumera/local.properties
          acra.url=https://dummy.acra.url/
          acra.token=dummy_token
          tmdb.api_key=${{ secrets.TMDB_API_KEY }}
          TRAKT_CLIENT_ID=dummy_trakt_id
          TRAKT_CLIENT_SECRET=dummy_trakt_secret
          EOF

      # 5. Grant execute permission for gradlew
      - name: Grant execute permission for gradlew
        run: chmod +x Lumera/gradlew

      # 6. Build the APK (Debug version)
      - name: Build Debug APK
        working-directory: Lumera
        run: ./gradlew assembleDebug --stacktrace

      # 7. Upload the generated Debug APK
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Lumera-Debug-APK
          path: Lumera/app/build/outputs/apk/debug/*.apk

      # 8. Validate Release Signing Credentials (Fail-Fast)
      - name: Validate Release Signing Credentials
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD || secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          echo "Validando credenciais de assinatura para Release APK..."
          MISSING=0
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret de assinatura ausente: RELEASE_KEYSTORE_BASE64"
            MISSING=1
          fi
          if [ -z "$STORE_PASSWORD" ]; then
            echo "::error::Secret de assinatura ausente: RELEASE_STORE_PASSWORD (ou RELEASE_KEYSTORE_PASSWORD)"
            MISSING=1
          fi
          if [ -z "$KEY_ALIAS" ]; then
            echo "::error::Secret de assinatura ausente: RELEASE_KEY_ALIAS"
            MISSING=1
          fi
          if [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Secret de assinatura ausente: RELEASE_KEY_PASSWORD"
            MISSING=1
          fi
          if [ "$MISSING" -ne 0 ]; then
            echo "::error::Credenciais de assinatura de Release incompletas no GitHub Secrets! Abortando execução para impedir geração de APK não assinado."
            exit 1
          fi
          echo "Todas as credenciais de assinatura de release foram validadas com sucesso."

      # 9. Decode Release Keystore
      - name: Decode Release Keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > Lumera/app/release.keystore
          if [ ! -s "Lumera/app/release.keystore" ]; then
            echo "::error::Falha na decodificação do keystore: arquivo Lumera/app/release.keystore vazio ou inexistente!"
            exit 1
          fi

      # 10. Build Release APK (Signed Production version)
      - name: Build Release APK
        working-directory: Lumera
        env:
          KEYSTORE_PATH: "app/release.keystore"
          RELEASE_KEYSTORE_PATH: "app/release.keystore"
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD || secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD || secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: ./gradlew assembleRelease --stacktrace

      # 11. Upload Release APK
      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: LumeraX-Release-APK
          path: Lumera/app/build/outputs/apk/release/*.apk