name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch: 

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      # 1. Baixa o código do seu repositório (Lumera)
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Baixa o projeto auxiliar de legendas (assrender) no caminho esperado
      - name: Checkout assrender
        uses: actions/checkout@v4
        with:
          repository: LumeraD3v/assrender
          path: '../assrender'

      # 3. Configura o Java 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # 4. Dá permissão de execução para o Gradle
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 5. Constrói o APK (Versão Debug)
      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      # 6. Salva o APK gerado para você baixar
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Lumera-Meu-APK
          path: app/build/outputs/apk/debug/*.apk