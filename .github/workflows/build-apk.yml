name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  # Permite que você clique em um botão para rodar a action quando quiser:
  workflow_dispatch: 

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      # 1. Baixa o código do seu repositório
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Configura o Java 17 (Requisito do Lumera)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # 3. Dá permissão de execução para o Gradle
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 4. Constrói o APK (Versão Debug)
      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      # 5. Salva o APK gerado para você baixar
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Lumera-Meu-APK
          path: app/build/outputs/apk/debug/*.apk