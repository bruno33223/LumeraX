name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch: 

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout the main repository into a 'Lumera' directory
      - name: Checkout Lumera
        uses: actions/checkout@v4
        with:
          path: Lumera
          submodules: recursive

      # 2. Checkout the auxiliary project into a sibling 'assrender' directory
      - name: Checkout assrender
        uses: actions/checkout@v4
        with:
          repository: LumeraD3v/assrender
          path: assrender
          submodules: recursive

      # 3. Verify directory structure for assrender
      - name: Verify assrender directory
        run: |
          echo "Current directory structure:"
          ls -R .
          if [ ! -d "assrender/assrender" ]; then
            echo "::error::assrender/assrender directory not found! Check repository structure."
            exit 1
          fi

      # 4. Set up JDK 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # 4. Create empty local.properties to avoid build warnings/errors
      - name: Create local.properties
        run: touch Lumera/local.properties

      # 5. Grant execute permission for gradlew
      - name: Grant execute permission for gradlew
        run: chmod +x Lumera/gradlew

      # 6. Build the APK (Debug version)
      - name: Build Debug APK
        working-directory: Lumera
        run: ./gradlew assembleDebug --stacktrace

      # 7. Upload the generated APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Lumera-Meu-APK
          path: Lumera/app/build/outputs/apk/debug/*.apk